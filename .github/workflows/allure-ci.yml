name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r e2e-framework/requirements.txt

      - name: Run tests with Allure
        run: |
          pytest e2e-framework/src/tests/demoqa/test_api/test_demoqa_api.py --alluredir=allure-results

      - name: Setup Allure
        uses: allure-actions/setup-allure@v2
        with:
          version: latest

      - name: Generate Allure report
        run: |
          allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 7