name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write
  pages: write

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose build e2e-demoqa

      - name: Run E2E tests for demoqa
        run: docker compose run --rm e2e-demoqa

      - name: Show reports dir (debug)
        run: |
          echo "Reports content:"
          ls -la e2e-framework/reports || true
          ls -la e2e-framework/reports/allure-results || true

      - name: Generate Allure report
        run: |
          docker run --rm -v ${{ github.workspace }}/e2e-framework/reports:/app/reports -w /app/reports tobix/allure-cli generate ./allure-results --clean -o ./allure-report

      - name: Show generated report dir (debug)
        run: ls -la e2e-framework/reports/allure-report || true

      - name: Upload Allure report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: e2e-framework/reports/allure-report

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.CI-TOKEN }}
          publish_dir: e2e-framework/reports/allure-report

      - name: Docker cleanup
        if: always()
        run: docker compose down -v