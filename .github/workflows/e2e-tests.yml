name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      # ===== CHECKOUT =====
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===== DOCKER SETUP =====
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      # ===== BUILD IMAGES =====
      - name: Build Docker images
        run: |
          docker compose build e2e-tests-demoqa

      # ===== RUN DEMOQA TESTS =====
      - name: Run E2E tests for demoqa
        run: |
          docker compose run --rm e2e-demoqa

      # ===== GENERATE ALLURE REPORT =====
      - name: Generate Allure report
        run: |
          docker run --rm -v $(pwd)/e2e-framework/reports:/app/reports -w /app/reports allure-framework/allure-cli generate allure-results --clean -o allure-report

      # ===== UPLOAD ALLURE REPORT =====
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: e2e-framework/reports/allure-report

      # ===== CLEANUP =====
      - name: Docker cleanup
        if: always()
        run: |
          docker compose down -v