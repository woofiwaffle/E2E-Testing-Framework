name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      # ===== CHECKOUT =====
      - name: Checkout repository
        uses: actions/checkout@v4

      # ===== DOCKER SETUP =====
      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      # ===== BUILD IMAGES =====
      - name: Build Docker images
        run: |
          docker compose build e2e-demoqa

      # ===== RUN DEMOQA TESTS =====
      - name: Run E2E tests for demoqa
        run: |
          docker compose run --rm e2e-demoqa

      # ===== GENERATE ALLURE REPORT =====
      - name: Copy history from gh-pages to allure-results
        run: |
          sudo mkdir -p allure-results/history 
          sudo cp -R ./.github/gh-pages/history/* allure-results/history/

      - name: Generate Allure report
        run: |
          sudo docker-compose run regression /bin/sh -c "allure generate allure-results --clean -o allure-report"

      - name: Update Allure history
        run: |
          sudo cp -R allure-report/history/* ./.github/gh-pages/history/

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@4.1.5
        with:
          token: ${{ secrets.CI_TOKEN }}
          branch: gh-pages
          folder: allure-report
          clean: true

      # ===== CLEANUP =====
      - name: Docker cleanup
        if: always()
        run: |
          docker compose down -v