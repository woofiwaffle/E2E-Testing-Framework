version: '3.9'

services:
  demo-app:
    build:
      context: ./demo-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"

  e2e-tests:
    build:
      context: .
      dockerfile: docker/Dockerfile
    depends_on:
      - demo-app
    environment:
      BASE_URL: "http://demo-app:3000/"
    volumes:
      - ./reports:/app/reports
    command: pytest -v --alluredir=reports/allure

  allure-report:
    image: frankescobar/allure-docker-service
    ports:
      - "8080:8080"
    depends_on:
      - e2e-tests
    volumes:
      - ./reports:/app/allure-results

