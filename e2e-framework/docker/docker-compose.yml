version: '3.9'

services:
  demo-app:
    build:
      context: ./demo-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/healthz || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 10

  e2e-tests:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      demo-app:
        condition: service_healthy
    environment:
      BASE_URL: "http://demo-app:3000/"
      REPORTS_DIR: /app/reports
    volumes:
      - ../reports:/app/reports
    command: bash docker/entrypoint.sh