<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Demo App</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 24px; }
    #result { margin-top: 12px; padding: 8px; border: 1px solid #ddd; background: #fafafa; }
    label { display:block; margin-bottom:6px; }
  </style>
</head>
<body>
  <h1>Demo Home Page</h1>

  <div>
    <label for="demo-input">Demo input:</label>
    <input id="demo-input" type="text" placeholder="Type something" />
  </div>

  <div style="margin-top:8px;">
    <button id="demo-button">Send to server</button>
  </div>

  <div id="result" aria-live="polite" role="status">Result will appear here</div>

  <script>
    const btn = document.getElementById('demo-button');
    const input = document.getElementById('demo-input');
    const result = document.getElementById('result');

    btn.addEventListener('click', async () => {
      const text = input.value;
      try {
        const resp = await fetch('/api/echo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        const data = await resp.json();
        result.textContent = data.echo || '(empty)';
        console.log('Server response:', data);
      } catch (err) {
        console.error(err);
        result.textContent = 'Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
